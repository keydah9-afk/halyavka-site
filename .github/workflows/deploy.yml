# Автодеплой halyavka.net на Hetzner Webhosting.
#
# Срабатывает на каждый push в master (и вручную кнопкой Run workflow).
# Собирает сайт у GitHub и заливает готовый dist на сервер по rsync.
#
# Картинок в репозитории нет, поэтому сборка здесь весит ~100 МБ вместо 4.6 ГБ,
# а папка images/ на сервере деплоем не трогается вообще.

name: Deploy

# ВРЕМЕННО: только ручной запуск, чтобы первый прогон можно было сделать
# вхолостую. Автозапуск по push в master включим, когда убедимся, что всё
# работает.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Холостой прогон — показать что изменилось бы, ничего не заливая'
        type: boolean
        default: true

# Два деплоя одновременно не запускаем, но и не отменяем начатый.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Собрать сайт
        run: pnpm build

      - name: Проверить, что собралось
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html не создан — сборка пустая"; exit 1; }
          echo "Размер сборки: $(du -sh dist | cut -f1), файлов: $(find dist -type f | wc -l)"

      - name: Подготовить SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Залить на сервер
        env:
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          if [ -n "$DRY" ]; then
            echo "::notice::ХОЛОСТОЙ ПРОГОН — на сервере ничего не изменится"
          else
            echo "::notice::БОЕВАЯ ЗАЛИВКА"
          fi
          rsync -rltvz --stats $DRY \
            --chmod=D755,F644 \
            --delete \
            --exclude='/images/' \
            --filter='protect /google*.html' \
            --filter='protect /dist.zip' \
            --filter='protect /.htaccess' \
            --filter='protect /.well-known/' \
            --filter='protect /cgi-bin/' \
            --filter='protect /logs/' \
            --filter='protect /stats/' \
            --exclude='.DS_Store' --exclude='._*' \
            -e "ssh -p 222 -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            dist/ "${{ secrets.DEPLOY_TARGET }}/"

      # Cloudflare держит копии страниц у себя и после заливки какое-то время
      # продолжает отдавать старые. Старая страница зовёт файлы обложек со
      # старыми хэшами, а их уже нет — картинки бьются. Сбрасываем кеш сразу.
      # Делаем это и в холостом прогоне тоже: сброс безвреден, зато сразу видно,
      # что токен и Zone ID заданы верно.
      - name: Сбросить кеш Cloudflare
        run: |
          resp=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if echo "$resp" | grep -q '"success":true'; then
            echo "::notice::Кеш Cloudflare сброшен"
          else
            echo "Ответ Cloudflare: $resp"
            echo "::error::Cloudflare отклонил запрос — проверь секреты CF_API_TOKEN и CF_ZONE_ID"
            exit 1
          fi

      - name: Проверить живой сайт
        if: ${{ !inputs.dry_run }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://halyavka.net/)
          echo "Главная отдаёт HTTP $code"
          test "$code" = "200" || { echo "::error::Сайт отвечает $code вместо 200"; exit 1; }
